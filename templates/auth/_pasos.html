<ol class="pasos" aria-label="Progreso de recuperación">
  <li class="{% if paso == 1 %}actual{% else %}hecho{% endif %}" {% if paso == 1 %}aria-current="step"{% endif %}>Solicitar código</li>
  <li class="{% if paso == 2 %}actual{% elif paso > 2 %}hecho{% endif %}" {% if paso == 2 %}aria-current="step"{% endif %}>Validar código</li>
  <li class="{% if paso == 3 %}actual{% endif %}" {% if paso == 3 %}aria-current="step"{% endif %}>Nueva contraseña</li>
</ol>
